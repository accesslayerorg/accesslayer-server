name: Server CI

on:
   push:
      branches:
         - main
   pull_request:

jobs:
   verify:
      runs-on: ubuntu-latest

      steps:
         - name: Checkout
           uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

         - name: Setup pnpm
           uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
           with:
              version: 10.6.5

         - name: Setup Node.js
           uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 20
              cache: pnpm

         - name: Install dependencies
           run: pnpm install --frozen-lockfile

         - name: Enforce pnpm lockfile only
           run: sh ./scripts/check-no-package-lock.sh

         - name: Generate Prisma client
           run: pnpm exec prisma generate

         - name: Lint
           run: pnpm lint

         - name: Build
           run: pnpm build

         - name: Check OpenAPI spec is up to date
           run: |
              pnpm docs:generate
              if [ -n "$(git status --porcelain -- docs/openapi.json)" ]; then
                 echo "::error file=docs/openapi.json::docs/openapi.json is out of date. Run 'pnpm docs:generate' and commit the result."
                 git --no-pager diff -- docs/openapi.json
                 exit 1
              fi

   invoice-protocol:
      runs-on: ubuntu-latest
      services:
         postgres:
            image: postgres:16
            env:
               POSTGRES_USER: accesslayer
               POSTGRES_PASSWORD: local-test-only
               POSTGRES_DB: invoice_protocol_test
            ports:
               - 5432:5432
            options: >-
               --health-cmd "pg_isready -U accesslayer -d invoice_protocol_test"
               --health-interval 5s
               --health-timeout 5s
               --health-retries 10
      env:
         DATABASE_URL: postgresql://accesslayer:local-test-only@localhost:5432/invoice_protocol_test
         RUN_INVOICE_PROTOCOL_INTEGRATION: '1'
         PUPPETEER_SKIP_DOWNLOAD: '1'
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
         - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
           with:
              version: 10.6.5
         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 20
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm exec prisma generate
         - name: Create disposable test schema
           run: pnpm exec prisma db push --skip-generate
         - name: Invoice protocol database and HTTP integration
           run: pnpm test --runInBand --testPathPatterns=invoice-protocol --globals='{"ts-jest":{"isolatedModules":true}}'

   loadtest:
      runs-on: ubuntu-latest
      services:
         postgres:
            image: postgres:16
            env:
               POSTGRES_USER: accesslayer
               POSTGRES_PASSWORD: local-test-only
               POSTGRES_DB: accesslayer_loadtest
            ports:
               - 5432:5432
            options: >-
               --health-cmd "pg_isready -U accesslayer -d accesslayer_loadtest"
               --health-interval 5s
               --health-timeout 5s
               --health-retries 10
         redis:
            image: redis:7-alpine
            ports:
               - 6379:6379
            options: >-
               --health-cmd "redis-cli ping"
               --health-interval 5s
               --health-timeout 5s
               --health-retries 10
      env:
         DATABASE_URL: postgresql://accesslayer:local-test-only@localhost:5432/accesslayer_loadtest
         REDIS_URL: redis://localhost:6379
         PORT: 3000
         NODE_ENV: test
         MODE: test
         DISABLE_RATE_LIMIT: 'true'
         QUERY_COST_BUDGET: 10000000
         QUERY_COST_ADMIN_WALLETS: GCFIRY65OQE7DFP5KLNS2PF2LVZMUZYJX4OZIEQ36N2IQANUB5XVYOJR
         ENABLE_REDIS_CACHE: 'true'
         JWT_SECRET: accesslayer_default_development_jwt_secret_key_32_bytes
         JWT_ISSUER: accesslayer-server
         ENABLE_REQUEST_LOGGING: 'false'
         PUPPETEER_SKIP_DOWNLOAD: '1'
         GMAIL_USER: test@example.com
         GMAIL_APP_PASSWORD: test-password
         GOOGLE_CLIENT_ID: test-google-client-id
         GOOGLE_CLIENT_SECRET: test-google-client-secret
         BACKEND_URL: http://localhost:3000
         FRONTEND_URL: http://localhost:5173
         PUBLIC_SITE_URL: http://localhost:5173
         CLOUDINARY_CLOUD_NAME: test-cloud
         CLOUDINARY_API_KEY: test-api-key
         CLOUDINARY_API_SECRET: test-api-secret
         PAYSTACK_SECRET_KEY: test-paystack-secret
      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

         - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
           with:
              version: 10.6.5

         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 20
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - run: pnpm exec prisma generate

         - name: Push database schema
           run: pnpm exec prisma db push --skip-generate

         - name: Seed database (10,000 keys, 100,000 trades)
           run: pnpm exec ts-node --transpile-only loadtest/seed.ts

         - name: Verify seed idempotency
           run: pnpm exec ts-node --transpile-only loadtest/seed.ts

         - name: Setup k6
           uses: grafana/setup-k6-action@c47136d33d365efbeb9ae7266908b5dcf98cdece # v1

         - name: Build and start application server
           run: |
              pnpm build
              node dist/server.js > server.log 2>&1 &
              SERVER_PID=$!
              for i in {1..30}; do
                 if curl -sf http://localhost:3000/api/v1/health > /dev/null; then
                    echo "Server is ready"
                    break
                 fi
                 echo "Waiting for server to start ($i)..."
                 sleep 1
              done
              if ! kill -0 $SERVER_PID 2>/dev/null; then
                 echo "Server process terminated unexpectedly. Server log:"
                 cat server.log
                 exit 1
              fi

         - name: Run k6 smoke profile
           run: pnpm run loadtest:smoke

         - name: Upload k6 summary report
           if: always()
           uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
           with:
              name: k6-loadtest-summary
              path: loadtest-summary.json
              if-no-files-found: warn

   error-catalog:
      runs-on: ubuntu-latest

      steps:
         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

         - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
           with:
              repository: accesslayerorg/accesslayer-contracts
              path: contracts-src

         - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
           with:
              version: 10.6.5

         - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 20
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         # Fails when error-catalog.json is stale or when a contract error has
         # no doc comment and is not in scripts/error-catalog-baseline.json (#1326).
         - name: Verify contract error catalog
           run: pnpm exec ts-node --transpile-only scripts/build-error-catalog.ts --contracts-dir contracts-src --check

   migration-safety:
      # Checks only migrations added or changed by the pull request against the
      # base branch. See docs/migrations.md (#1344).
      if: github.event_name == 'pull_request'
      runs-on: ubuntu-latest

      steps:
         - name: Checkout
           uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
           with:
              fetch-depth: 0

         - name: Setup pnpm
           uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
           with:
              version: 10.6.5

         - name: Setup Node.js
           uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
           with:
              node-version: 20
              cache: pnpm

         - run: pnpm install --frozen-lockfile

         - name: Check new migrations for expand/contract safety
           run: pnpm exec ts-node --transpile-only scripts/check-migrations.ts --base "origin/${{ github.base_ref }}"
