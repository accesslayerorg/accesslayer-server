name: Chaos Nightly

on:
   schedule:
      - cron: '0 3 * * *'
   workflow_dispatch:

jobs:
   chaos:
      runs-on: ubuntu-latest
      timeout-minutes: 20
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
           with:
              version: 10.6.5
         - uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - name: Start app
           run: |
              cp .env.example .env
              pnpm build
              pnpm start &
              echo $! > app.pid
              sleep 10
         - name: Run chaos suite
           run: ./chaos/run-chaos.sh
         - name: Upload chaos artifacts
           if: always()
           uses: actions/upload-artifact@v4
           with:
              name: chaos-artifacts
              path: chaos/artifacts
         - name: Stop app
           if: always()
           run: kill $(cat app.pid) || true
