name: SDK Generate Check

on:
   pull_request:
   push:
      branches: [main]

jobs:
   sdk-generate:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v4
         - uses: pnpm/action-setup@v4
           with:
              version: 10.6.5
         - uses: actions/setup-node@v4
           with:
              node-version: 20
              cache: pnpm
         - run: pnpm install --frozen-lockfile
         - run: pnpm --filter @accesslayer/sdk run generate
         - run: git diff --exit-code -- packages/sdk/src/generated/schema.ts
