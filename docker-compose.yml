services:
   redis:
      image: redis:7-alpine
      container_name: accesslayer-redis
      restart: unless-stopped
      ports:
         - '6379:6379'
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5

   postgres:
      image: postgres:16-alpine
      container_name: accesslayer-postgres
      restart: unless-stopped
      environment:
         POSTGRES_DB: accesslayer_test
         POSTGRES_USER: accesslayer
         POSTGRES_PASSWORD: local-test-only
      ports:
         - '5432:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U postgres -d accesslayer']
         interval: 10s
         timeout: 5s
         retries: 5

volumes:
   postgres_data:
