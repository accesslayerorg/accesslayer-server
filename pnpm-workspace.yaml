packages:
   - .
   - packages/*

# Patched releases of vulnerable transitive dependencies, held to the major
# version their dependents already request (see docs/security/supply-chain.md).
overrides:
   'body-parser@2': '^2.4.0'
   'brace-expansion@1': '^1.1.20'
   'brace-expansion@2': '^2.1.6'
   'brace-expansion@5': '^5.0.11'
   'browserslist@4': '^4.28.7'
   'effect@3': '^3.22.1'
   'fast-uri@3': '^3.1.7'
   'follow-redirects@1': '^1.16.2'
   'ip-address@10': '^10.3.1'
   'js-yaml@3': '^3.15.2'
   'js-yaml@4': '^4.3.2'
   'proxy-addr@2': '^2.0.8'
